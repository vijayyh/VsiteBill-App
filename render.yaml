services:
  - type: web
    name: vsitebill-api
    runtime: python
    region: singapore
    plan: 0.5c-512mb
    rootDir: backend
    buildCommand: pip install -r requirements.txt gunicorn psycopg2-binary
    startCommand: flask db upgrade && gunicorn app:app
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      # Supabase Postgres (project VsiteBilll-DB, Singapore), session pooler URL, since
      # 2026-10-16. Set by hand in the dashboard; no longer linked to a Render database.
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: GOOGLE_VISION_API_KEY
        sync: false
    disk:
      name: delivery-uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1

  - type: web
    name: vsitebill-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_BASE
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# The Render database vsitebill-db (free tier) was replaced by Supabase on 2026-10-16 and
# expires on 2026-10-19; it is no longer declared here.
