  <head>

    <link rel="apple-touch-startup-image" href="/splash/ios-1260x2736.png" media="(device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/ios-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/ios-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/ios-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/ios-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/ios-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/ios-1242x2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/ios-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/ios-1242x2208.png" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/ios-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <title>SiteVerify</title>
    <!--
      Opening splash. Plain HTML/CSS so its first frame paints before any app code loads. That frame
      is identical to the Android app's native splash (pwa-512.png at 300px on navy), so the native
      splash hands over to it seamlessly. src/lib/splash.ts plays the rest once the app has rendered:
      .sv-play (and .sv-offline), .sv-wait while the server wakes, then .sv-exit, and removes it.
    -->
    <style>
      #sv-splash {
        position: fixed; inset: 0; z-index: 2147483000; overflow: hidden;
        background: #1a3c5e; color: #fff;
        font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none;
        --sv-delay: 0ms;
      }
      #sv-splash .sv-stage { position: absolute; inset: 0; }
      #sv-splash .sv-aura {
        position: absolute; left: 50%; top: calc(50% - 78px); width: 560px; height: 560px;
        margin: -280px 0 0 -280px; border-radius: 50%; opacity: 0;
        background: radial-gradient(circle, rgba(70, 150, 210, 0.3) 0%, rgba(26, 60, 94, 0) 62%);
      }
      #sv-splash .sv-logo {
        position: absolute; left: 50%; top: 50%; width: 300px; height: 300px;
        margin: -150px 0 0 -150px; overflow: visible;
      }
      #sv-splash .sv-sheen { transform: translateX(-300px); }
      #sv-splash .sv-ripple, #sv-splash .sv-check { transform-box: fill-box; transform-origin: center; }
      #sv-splash .sv-ripple { opacity: 0; }
      #sv-splash .sv-text {
        position: absolute; left: 0; right: 0; top: calc(50% + 34px); padding: 0 24px; text-align: center;
      }
      #sv-splash .sv-name { font-size: 36px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
      #sv-splash .sv-name span { display: inline-block; opacity: 0; }
      #sv-splash .sv-name .sv-green { color: #86dba6; }
      #sv-splash .sv-tagline { margin-top: 8px; font-size: 15px; color: rgba(255, 255, 255, 0.72); opacity: 0; }
      #sv-splash .sv-status {
        display: inline-flex; align-items: center; gap: 10px; margin-top: 28px; height: 34px; padding: 0 16px;
        border-radius: 999px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.14);
        font-size: 13px; color: rgba(255, 255, 255, 0.85); opacity: 0;
      }
      #sv-splash .sv-dots { display: inline-flex; gap: 4px; }
      #sv-splash .sv-dots i {
        width: 6px; height: 6px; border-radius: 50%; background: #86dba6;
        animation: sv-dot 1.1s ease-in-out infinite;
      }
      #sv-splash .sv-dots i:nth-child(2) { animation-delay: 0.15s; }
      #sv-splash .sv-dots i:nth-child(3) { animation-delay: 0.3s; }
      #sv-splash.sv-offline .sv-dots i { background: #f0b45a; animation: none; }
      #sv-splash.sv-offline .sv-dots i:nth-child(n + 2) { display: none; }
      #sv-splash .sv-footer {
        position: absolute; left: 0; right: 0; bottom: calc(26px + env(safe-area-inset-bottom, 0px));
        text-align: center; font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;
        color: rgba(255, 255, 255, 0.5); opacity: 0;
      }

      /* Intro: the document lifts, a light sweeps across it, the check gets "stamped" with a
         ripple, and the name rises in letter by letter. --sv-delay holds the first frame a moment
         in the Android app so the native splash can finish fading out first. */
      #sv-splash.sv-play .sv-logo { animation: sv-lift 950ms cubic-bezier(0.22, 1, 0.36, 1) var(--sv-delay) both; }
      #sv-splash.sv-play .sv-aura {
        animation: sv-fade-in 900ms ease-out calc(var(--sv-delay) + 150ms) forwards,
          sv-breathe 2800ms ease-in-out calc(var(--sv-delay) + 1400ms) infinite alternate;
      }
      /* The tile (and its glow) is only there so the first frame matches the native splash: it
         hands its glow over to the larger aura, which doesn't move with the logo. */
      #sv-splash.sv-play .sv-tile { animation: sv-fade-out 380ms ease-out calc(var(--sv-delay) + 40ms) forwards; }
      #sv-splash.sv-play .sv-sheen { animation: sv-sheen 1150ms cubic-bezier(0.45, 0, 0.2, 1) calc(var(--sv-delay) + 180ms) both; }
      #sv-splash.sv-play .sv-check { animation: sv-stamp 720ms ease-in-out calc(var(--sv-delay) + 420ms) both; }
      #sv-splash.sv-play .sv-ripple { animation: sv-ripple 1100ms cubic-bezier(0.2, 0.7, 0.3, 1) calc(var(--sv-delay) + 560ms) forwards; }
      #sv-splash.sv-play .sv-name span {
        animation: sv-rise 650ms cubic-bezier(0.22, 1, 0.36, 1) calc(var(--sv-delay) + 420ms + var(--i) * 32ms) both;
      }
      #sv-splash.sv-play .sv-tagline { animation: sv-rise 700ms cubic-bezier(0.22, 1, 0.36, 1) calc(var(--sv-delay) + 820ms) both; }
      #sv-splash.sv-play .sv-footer { animation: sv-fade-in 800ms ease-out calc(var(--sv-delay) + 1000ms) forwards; }
      #sv-splash.sv-wait .sv-status,
      #sv-splash.sv-offline .sv-status { animation: sv-rise 500ms cubic-bezier(0.22, 1, 0.36, 1) both; }
      #sv-splash.sv-offline .sv-status { animation-delay: calc(var(--sv-delay) + 900ms); }

      /* Exit: everything eases forward and fades, revealing the app (already rendered underneath). */
      #sv-splash.sv-exit { animation: sv-out 520ms cubic-bezier(0.4, 0, 0.2, 1) forwards; pointer-events: none; }
      #sv-splash.sv-exit .sv-stage { animation: sv-stage-out 520ms cubic-bezier(0.4, 0, 0.2, 1) forwards; }

      @keyframes sv-lift { to { transform: translateY(-78px) scale(0.74); } }
      @keyframes sv-sheen { from { transform: translateX(-300px); } to { transform: translateX(300px); } }
      @keyframes sv-stamp {
        0% { transform: scale(1); }
        28% { transform: scale(0.84); }
        62% { transform: scale(1.14); }
        100% { transform: scale(1); }
      }
      @keyframes sv-ripple { 0% { opacity: 0.75; transform: scale(0.55); } 100% { opacity: 0; transform: scale(2.5); } }
      @keyframes sv-rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
      @keyframes sv-fade-in { to { opacity: 1; } }
      @keyframes sv-fade-out { to { opacity: 0; } }
      @keyframes sv-breathe { from { transform: scale(1); } to { transform: scale(1.1); } }
      @keyframes sv-dot { 0%, 80%, 100% { opacity: 0.3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
      @keyframes sv-out { to { opacity: 0; visibility: hidden; } }
      @keyframes sv-stage-out { to { transform: translateY(-10px) scale(1.06); } }

      @media (prefers-reduced-motion: reduce) {
        #sv-splash, #sv-splash * {
          animation-duration: 1ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="sv-splash" role="status" aria-label="SiteVerify is starting">
      <div class="sv-stage">
        <div class="sv-aura"></div>
        <!-- Same artwork as brand/icon.svg (the app icon). -->
        <svg class="sv-logo" viewBox="0 0 512 512" aria-hidden="true">
          <defs>
            <radialGradient id="sv-glow" cx="256" cy="244" r="232" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#2F6C9F" />
              <stop offset="0.55" stop-color="#235380" />
              <stop offset="1" stop-color="#1A3C5E" />
            </radialGradient>
            <linearGradient id="sv-green" x1="0" y1="-40" x2="0" y2="60" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#3FB872" />
              <stop offset="1" stop-color="#1F8447" />
            </linearGradient>
            <linearGradient id="sv-fold" x1="48" y1="-82" x2="72" y2="-106" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#E4EBF3" />
              <stop offset="1" stop-color="#AFC1D5" />
            </linearGradient>
            <linearGradient id="sv-sheen-fill" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#FFFFFF" stop-opacity="0" />
              <stop offset="0.5" stop-color="#DCEBFA" stop-opacity="0.9" />
              <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
            </linearGradient>
            <filter id="sv-lift" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur in="SourceAlpha" stdDeviation="12" />
              <feOffset dy="12" result="blur" />
              <feFlood flood-color="#06162A" flood-opacity="0.5" />
              <feComposite in2="blur" operator="in" />
              <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
            </filter>
            <clipPath id="sv-doc-clip">
              <path d="M-102 -112 A24 24 0 0 1 -78 -136 H40 L102 -74 V112 A24 24 0 0 1 78 136 H-78 A24 24 0 0 1 -102 112 Z" />
            </clipPath>
          </defs>
          <rect class="sv-tile" width="512" height="512" rx="114" fill="url(#sv-glow)" />
          <g transform="translate(256 252)">
            <path filter="url(#sv-lift)" fill="#FFFFFF"
              d="M-102 -112 A24 24 0 0 1 -78 -136 H40 L102 -74 V112 A24 24 0 0 1 78 136 H-78 A24 24 0 0 1 -102 112 Z" />
            <g clip-path="url(#sv-doc-clip)">
              <g transform="rotate(20)"><rect class="sv-sheen" x="-55" y="-260" width="110" height="520" fill="url(#sv-sheen-fill)" /></g>
            </g>
            <path d="M40 -136 V-92 A18 18 0 0 0 58 -74 H102 Z" fill="url(#sv-fold)" />
            <rect x="-66" y="-100" width="72" height="16" rx="8" fill="#1A3C5E" />
            <circle class="sv-ripple" cx="2" cy="14" r="58" fill="none" stroke="#3FB872" stroke-width="5" />
            <path class="sv-check" d="M-56 14 L-16 54 L60 -26" fill="none" stroke="url(#sv-green)" stroke-width="32"
              stroke-linecap="round" stroke-linejoin="round" />
          </g>
        </svg>
        <div class="sv-text">
          <div class="sv-name" aria-hidden="true"><span style="--i: 0">S</span><span style="--i: 1">i</span><span style="--i: 2">t</span><span style="--i: 3">e</span><span class="sv-green" style="--i: 4">V</span><span class="sv-green" style="--i: 5">e</span><span class="sv-green" style="--i: 6">r</span><span class="sv-green" style="--i: 7">i</span><span class="sv-green" style="--i: 8">f</span><span class="sv-green" style="--i: 9">y</span></div>
          <div class="sv-tagline">Every bill, checked on site.</div>
          <div class="sv-status"><span class="sv-dots"><i></i><i></i><i></i></span><span class="sv-status-text">Waking up the server…</span></div>
        </div>
      </div>
      <div class="sv-footer">KH Group · Sustaniq</div>
    </div>
    <script>
      // Only on the first open per session: a reload or the update banner goes straight to the app.
      // The animation itself is started by src/lib/splash.ts once the app has rendered underneath
      // (starting it sooner, while the phone is busy loading the app, makes it stall and jump).
      ;(function () {
        var splash = document.getElementById('sv-splash')
        try {
          if (sessionStorage.getItem('sv-splash-seen')) return splash.remove()
          sessionStorage.setItem('sv-splash-seen', '1')
        } catch (e) {}
        window.__svStart = performance.now()
        // If the app code never loads, don't leave the splash covering the screen.
        setTimeout(function () { if (splash.isConnected) splash.remove() }, 15000)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
