services:
  - type: web
    name: vsitebill-api
    runtime: python
    region: singapore
    plan: 0.5c-512mb
    rootDir: backend
    buildCommand: pip install -r requirements.txt gunicorn psycopg2-binary
    startCommand: gunicorn app:app
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: vsitebill-db
          property: connectionString
    disk:
      name: delivery-uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1

  - type: web
    name: vsitebill-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: vsitebill-db
    region: singapore
    plan: 0.1c-256mb
    databaseName: vsitebill
    user: vsitebill
