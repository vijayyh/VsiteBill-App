<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- SiteVerify app icon, master artwork. Rounded tile; icon-maskable.svg is the same art full-bleed.
       After editing, regenerate the PNGs: `npm run icons` in frontend/. The opening splash in
       index.html draws this same artwork inline; keep the two in step. -->
  <defs>
    <!-- Glow fades to exactly the navy background before the tile's edge, so on the navy opening
         screen the tile's outline disappears and only the document shows. -->
    <radialGradient id="sv-glow" cx="256" cy="244" r="232" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2F6C9F"/>
      <stop offset="0.55" stop-color="#235380"/>
      <stop offset="1" stop-color="#1A3C5E"/>
    </radialGradient>
    <linearGradient id="sv-green" x1="0" y1="-40" x2="0" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3FB872"/>
      <stop offset="1" stop-color="#1F8447"/>
    </linearGradient>
    <linearGradient id="sv-fold" x1="48" y1="-82" x2="72" y2="-106" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E4EBF3"/>
      <stop offset="1" stop-color="#AFC1D5"/>
    </linearGradient>
    <filter id="sv-lift" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dy="12" result="blur"/>
      <feFlood flood-color="#06162A" flood-opacity="0.5"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#sv-glow)"/>
  <g transform="translate(256 252)">
    <path filter="url(#sv-lift)" fill="#FFFFFF"
      d="M-102 -112 A24 24 0 0 1 -78 -136 H40 L102 -74 V112 A24 24 0 0 1 78 136 H-78 A24 24 0 0 1 -102 112 Z"/>
    <path d="M40 -136 V-92 A18 18 0 0 0 58 -74 H102 Z" fill="url(#sv-fold)"/>
    <rect x="-66" y="-100" width="72" height="16" rx="8" fill="#1A3C5E"/>
    <path d="M-56 14 L-16 54 L60 -26" fill="none" stroke="url(#sv-green)" stroke-width="32"
      stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
