# Runs on every push to main and every pull request. Render is set to deploy only
# after these checks pass, so a failing test keeps the last working version live.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
      - name: Production server smoke test (gunicorn + gunicorn.conf.py)
        run: |
          flask db upgrade
          PORT=8000 gunicorn app:app > gunicorn.log 2>&1 &
          server=$!
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
          # Fire concurrent requests; every one must succeed.
          pids=""
          for i in $(seq 1 10); do curl -sf -o /dev/null localhost:8000/api/health & pids="$pids $!"; done
          for p in $pids; do wait $p; done
          grep "Using worker: gthread" gunicorn.log
          kill $server

  frontend:
    name: Frontend lint, type check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
